# Nginx = pintu depan produksi: reverse proxy ke container aplikasi (+ SSL/TLS, lihat tls.conf.example).
# Nama host (dashboard, mobile-api) di-resolve lewat DNS Docker saat Nginx start/reload. Saat rilis, deploy.sh
# menjalankan container versi baru di samping versi lama lalu `nginx -s reload`, sehingga trafik pindah tanpa downtime.

upstream dashboard {
    server dashboard:3000;
    keepalive 16;
}

upstream mobile_api {
    server mobile-api:5001;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    server_tokens off;
    # Unggahan galeri maks. 25 MB (UPLOAD_LIMIT_MB) + ruang untuk header multipart.
    client_max_body_size 30m;

    # Teruskan identitas klien asli. Aplikasi memakai trust proxy = 1 hop, jadi req.ip = $remote_addr di sini,
    # bukan IP container Nginx (rate limiter login & log per pengguna tetap benar).
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;

    # Container yang sedang graceful shutdown menolak koneksi baru / menjawab 503 → coba container lain.
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Health check Nginx sendiri (Docker HEALTHCHECK).
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # API aplikasi mobile: https://<domain>/mobile/api/... → mobile-api:5001/api/...
    # (Flutter: --dart-define=API_URL=https://<domain>/mobile/api)
    location /mobile/ {
        proxy_pass http://mobile_api/;
    }

    # Aset statis Next.js punya nama ber-hash → boleh di-cache lama oleh browser.
    location /_next/static/ {
        proxy_pass http://dashboard;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Panel admin (Next.js). API dashboard tidak dibuka langsung; browser memakai proxy /api/be milik Next.js.
    location / {
        proxy_pass http://dashboard;
    }
}
