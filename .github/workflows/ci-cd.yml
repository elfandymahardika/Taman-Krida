# CI/CD TKBJ
#
# CI (setiap Pull Request ke main & setiap push/merge ke main):
#   backend   → npm ci, lint (typecheck TypeScript), npm test (dengan MariaDB), npm run build — kedua API
#   frontend  → npm ci, npm run lint (oxlint), npm test (Vitest), npm run build (Next.js)
#   flutter   → flutter analyze, flutter test
#   docker    → build ketiga image (multi-stage), jalankan seluruh stack docker compose, cek /health,
#               migration, dan graceful shutdown (SIGTERM) di Linux sungguhan
# CD (hanya push/merge ke main, setelah semua CI lolos):
#   publish   → push image ke GitHub Container Registry, tag = commit SHA (+ latest)
#   deploy    → SSH ke server lalu `bash deploy.sh <sha>` (rilis tanpa downtime + rollback otomatis).
#               Hanya berjalan bila variable repository DEPLOY_HOST diisi (lihat deploy/README.md).

name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  backend:
    name: Backend ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [admin-dashboard, mobile-app]
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: root
    defaults:
      run:
        working-directory: backend/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/admin-dashboard/package-lock.json
            backend/mobile-app/package-lock.json
      # Skema & migration database dimiliki API dashboard; test API mobile juga memakainya.
      - name: Install API dashboard
        working-directory: backend/admin-dashboard
        run: npm ci --no-audit --no-fund
      - name: Install ${{ matrix.app }}
        if: matrix.app != 'admin-dashboard'
        run: npm ci --no-audit --no-fund
      - name: Lint (typecheck TypeScript)
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  frontend:
    name: Frontend admin-dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/admin-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/admin-dashboard/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  flutter:
    name: Aplikasi mobile (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - run: flutter pub get
      - name: Lint
        run: flutter analyze
      - name: Test
        run: flutter test

  docker:
    name: Docker (build + smoke test stack)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: deploy
    env:
      IMAGE_TAG: ci
      REGISTRY: local
    steps:
      - uses: actions/checkout@v4
      - name: Siapkan .env uji
        run: |
          cp .env.example .env
          sed -i \
            -e "s|^PUBLIC_URL=.*|PUBLIC_URL=http://localhost:8080|" \
            -e "s|^HTTP_PORT=.*|HTTP_PORT=8080|" \
            -e "s|^HTTPS_PORT=.*|HTTPS_PORT=8443|" \
            -e "s|^DB_PASSWORD=.*|DB_PASSWORD=$(openssl rand -hex 16)|" \
            -e "s|^DB_ROOT_PASSWORD=.*|DB_ROOT_PASSWORD=$(openssl rand -hex 16)|" \
            -e "s|^ADMIN_JWT_SECRET=.*|ADMIN_JWT_SECRET=$(openssl rand -hex 32)|" \
            -e "s|^MOBILE_JWT_SECRET=.*|MOBILE_JWT_SECRET=$(openssl rand -hex 32)|" \
            .env
      - name: Build image (multi-stage)
        run: docker compose build
      - name: Ukuran image
        run: docker image ls --format '{{.Repository}}:{{.Tag}}  {{.Size}}' | grep '^local/'
      - name: Image tidak membawa rahasia/source
        run: |
          for img in local/tkbj-admin-api:ci local/tkbj-mobile-api:ci; do
            docker run --rm --entrypoint sh "$img" -c 'test ! -e .env && test ! -d src && test ! -d test && test ! -e node_modules/typescript'
          done
          docker run --rm --entrypoint sh local/tkbj-dashboard:ci -c 'test ! -e .env.local && test ! -d src && test ! -d tests'
      - name: Jalankan stack (tunggu semua health check)
        run: |
          docker compose up -d db
          docker compose run --rm migrate
          docker compose up -d --wait --wait-timeout 180
      - name: Smoke test lewat Nginx
        run: |
          set -x
          curl -fsS http://localhost:8080/nginx-health
          curl -fsS http://localhost:8080/api/health | tee /dev/stderr | grep -q '"backend":"up"'
          curl -fsS http://localhost:8080/mobile/health | tee /dev/stderr | grep -q '"database":"up"'
          curl -fsS http://localhost:8080/mobile/api/meta >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/login)" = 200
      - name: Graceful shutdown (SIGTERM)
        run: |
          docker compose stop admin-api mobile-api
          docker compose logs admin-api mobile-api | tee shutdown.log | tail -20
          test "$(grep -c 'Server berhenti dengan rapi' shutdown.log)" -ge 2
      - name: Log bila gagal
        if: failure()
        run: docker compose logs --tail 100
      - name: Bersihkan
        if: always()
        run: docker compose down -v

  publish:
    name: Publish image ${{ matrix.image.name }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, flutter, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image:
          - { name: admin-api, context: backend/admin-dashboard }
          - { name: mobile-api, context: backend/mobile-app }
          - { name: dashboard, context: frontend/admin-dashboard }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tkbj-${{ matrix.image.name }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

  deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_HOST != ''
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Rilis lewat SSH (zero-downtime, rollback otomatis bila health check gagal)
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          SHA: ${{ github.sha }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '${DEPLOY_PATH:-/opt/tkbj}' && git pull --ff-only && bash deploy/deploy.sh '$SHA'"
